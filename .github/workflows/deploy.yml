name: Deploy website

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '24'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'cloudflare_workers/**'
  repository_dispatch:
    types: [sync-deploy]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          BENTO_SITE_UUID: ${{ secrets.BENTO_SITE_UUID }}
          BENTO_PUBLISHABLE_KEY: ${{ secrets.BENTO_PUBLISHABLE_KEY }}
          BENTO_SECRET_KEY: ${{ secrets.BENTO_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMART_SUITE_APIKEY: ${{ secrets.SMART_SUITE_APIKEY }}
          SMART_SUITE_ACCOUNT_ID: ${{ secrets.SMART_SUITE_ACCOUNT_ID }}
          SMART_SUITE_TABLE_ID_COMPANY: ${{ secrets.SMART_SUITE_TABLE_ID_COMPANY }}
      - run: bun run seo:check
      - name: Deploy to Production
        id: prod_deploy
        run: |
          set -e
          sed -i 's/OPENAI_API_KEY_PLACEHOLDER/${{ secrets.OPENAI_API_KEY }}/g' dist/server/wrangler.json
          sed -i 's/STRIPE_SECRET_KEY_PLACEHOLDER/${{ secrets.STRIPE_SECRET_KEY }}/g' dist/server/wrangler.json
          sed -i 's/STRIPE_WEBHOOK_SECRET_PLACEHOLDER/${{ secrets.STRIPE_WEBHOOK_SECRET }}/g' dist/server/wrangler.json
          sed -i 's/BENTO_SITE_UUID_PLACEHOLDER/${{ secrets.BENTO_SITE_UUID }}/g' dist/server/wrangler.json
          sed -i 's/BENTO_PUBLISHABLE_KEY_PLACEHOLDER/${{ secrets.BENTO_PUBLISHABLE_KEY }}/g' dist/server/wrangler.json
          sed -i 's/BENTO_SECRET_KEY_PLACEHOLDER/${{ secrets.BENTO_SECRET_KEY }}/g' dist/server/wrangler.json
          sed -i 's/SMART_SUITE_APIKEY_PLACEHOLDER/${{ secrets.SMART_SUITE_APIKEY }}/g' dist/server/wrangler.json
          sed -i 's/SMART_SUITE_ACCOUNT_ID_PLACEHOLDER/${{ secrets.SMART_SUITE_ACCOUNT_ID }}/g' dist/server/wrangler.json
          sed -i 's/SMART_SUITE_TABLE_ID_COMPANY_PLACEHOLDER/${{ secrets.SMART_SUITE_TABLE_ID_COMPANY }}/g' dist/server/wrangler.json
          node -e "const f='dist/server/wrangler.json';const c=JSON.parse(require('fs').readFileSync(f));delete c.legacy_env;require('fs').writeFileSync(f,JSON.stringify(c));"
          output=$(bunx wrangler@latest deploy)
          echo "$output"
          url=$(echo "$output" | grep -Eo 'https://[^[:space:]]*\.nomad-magazine\.com|https://[^[:space:]]*\.workers\.dev' | head -1)
          if [ -z "$url" ]; then
            url="https://nomad-magazine.com"
          fi
          echo "deployment_url=$url" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Add deployment status to summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** Production deployment" >> $GITHUB_STEP_SUMMARY
          prod_url='${{ steps.prod_deploy.outputs.deployment_url }}'
          if [[ "$prod_url" == http* ]]; then
            echo "**Production URL:** [$prod_url]($prod_url)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Production URL:** ${prod_url:-Unavailable - check logs.}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
