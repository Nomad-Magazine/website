<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="600">
      <stop stop-color="#0B0B0B" />
      <stop offset="1" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDE68A" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#panel)" />

  <!-- Map-like nodes -->
  <g fill="#1F2937">
    <circle cx="200" cy="340" r="10" />
    <circle cx="340" cy="220" r="10" />
    <circle cx="520" cy="300" r="10" />
    <circle cx="700" cy="260" r="10" />
    <circle cx="860" cy="320" r="10" />
    <circle cx="1020" cy="240" r="10" />
  </g>

  <!-- Lines -->
  <g stroke="#374151" stroke-width="2">
    <path d="M200 340 Q 270 270 340 220" />
    <path d="M340 220 Q 430 270 520 300" />
    <path d="M520 300 Q 610 260 700 260" />
    <path d="M700 260 Q 780 300 860 320" />
    <path d="M860 320 Q 940 270 1020 240" />
  </g>

  <!-- Chips -->
  <g>
    <g transform="translate(120,420)">
      <rect width="220" height="80" rx="16" fill="#111827" stroke="#FDE68A" />
      <text x="20" y="50" fill="#E5E7EB" font-family="Inter, system-ui" font-size="22" font-weight="700">50+ EU locations</text>
    </g>
    <g transform="translate(460,420)">
      <rect width="260" height="80" rx="16" fill="#111827" stroke="#FDE68A" />
      <text x="20" y="50" fill="#E5E7EB" font-family="Inter, system-ui" font-size="22" font-weight="700">Coworking & Coliving</text>
    </g>
    <g transform="translate(840,420)">
      <rect width="240" height="80" rx="16" fill="#111827" stroke="#FDE68A" />
      <text x="20" y="50" fill="#E5E7EB" font-family="Inter, system-ui" font-size="22" font-weight="700">Event delivery</text>
    </g>
  </g>

  <!-- Title -->
  <text x="64" y="96" fill="#FFFFFF" font-family="Inter, system-ui" font-size="36" font-weight="800">Strategic European Distribution</text>
  <text x="64" y="136" fill="#9CA3AF" font-family="Inter, system-ui" font-size="20">Free shipping to 50+ locations, including Italia Nomad Fest</text>

  <!-- Euro chip -->
  <g transform="translate(980,64)">
    <rect width="156" height="48" rx="12" fill="url(#chip)" />
    <text x="20" y="32" fill="#111827" font-family="Inter, system-ui" font-size="22" font-weight="800">Included</text>
  </g>
</svg>














